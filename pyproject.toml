[project]
name = "leonida-alpha"
version = "0.1.0"
description = "Recorded proxy evidence research desk; candidate paper decisions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic==2.10.6",
  "httpx==0.28.1",
  "websockets>=14,<16",
  "imageio-ffmpeg>=0.6,<0.7",
  "rapidocr-onnxruntime>=1.4,<2",
  "pillow>=11,<13",
  "faster-whisper>=1.1,<2",
]

[dependency-groups]
dev = ["jsonschema>=4.23,<5", "playwright>=1.49,<2"]

[tool.uv]
package = false
